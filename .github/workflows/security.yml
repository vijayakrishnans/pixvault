name: Security

# The dependency gate (OWASP A03): no production dependency with an unaccepted high or critical advisory.
# Runs on every pull request and push to main, and weekly, since advisories appear without code changes.
# Actions are pinned by commit SHA (GAPS G81); the comment gives the tag.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Gate logic tests
        run: node --test tooling/security/audit.test.mjs
      - name: Audit production dependencies (reads the lockfile; nothing is installed)
        run: node tooling/security/audit.mjs
