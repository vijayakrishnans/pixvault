apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: storage-worker
  description: Pixvault's customer-bucket adapter (PV7) — tests buckets, holds their credentials envelope-encrypted and runs object operations; reached only over service bindings
spec:
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: media
  path: apps/storage-worker
  dependsOn:
    - component: cloudflare-d1
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  secretEnv:
    WIRING_CLOUDFLARE_D1_STAGE: "secret://ws_KG0H9PEH/pixvault/stage/WIRING_CLOUDFLARE_D1"
    WIRING_CLOUDFLARE_D1_PROD: "secret://ws_KG0H9PEH/pixvault/prod/WIRING_CLOUDFLARE_D1"

  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        dependencyMode: advisory
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        dependencyMode: advisory
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    orgName: sourceplane
    owner: sourceplane
    repo: pixvault

    turboFilter: "@saas/storage-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-d1"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/storage-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/storage-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    # STORAGE_KEK, the key that seals customer bucket credentials: generated here when the worker lacks it, piped
    # straight to Cloudflare, never printed or stored anywhere else (the pattern config-worker uses for its key).
    # Before the first deploy the worker doesn't exist yet, so this step may fail harmlessly; the smoke step after
    # the deploy then creates the key. A fresh key can't open credentials sealed under an old one: never delete it.
    preDeployCommand: |
      for e in stage prod; do
        if pnpm exec wrangler secret list --config wrangler.jsonc --env "$e" 2>/dev/null | grep -q '"STORAGE_KEK"'; then
          echo "STORAGE_KEK present for $e"
        else
          openssl rand -hex 32 | pnpm exec wrangler secret put STORAGE_KEK --config wrangler.jsonc --env "$e" >/dev/null 2>&1 && echo "STORAGE_KEK created for $e" || echo "STORAGE_KEK not set yet for $e (first deploy); the smoke step sets it"
        fi
      done
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: |
      for e in stage prod; do
        if ! pnpm exec wrangler secret list --config wrangler.jsonc --env "$e" 2>/dev/null | grep -q '"STORAGE_KEK"'; then
          openssl rand -hex 32 | pnpm exec wrangler secret put STORAGE_KEK --config wrangler.jsonc --env "$e" >/dev/null 2>&1
        fi
        pnpm exec wrangler secret list --config wrangler.jsonc --env "$e" 2>/dev/null | grep -q '"STORAGE_KEK"' || { echo "storage-worker: STORAGE_KEK missing for $e"; exit 1; }
        echo "storage-worker: STORAGE_KEK present for $e"
      done
  labels:
    team: platform
    layer: runtime
    surface: storage
    runtime: cloudflare
