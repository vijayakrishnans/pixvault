# PV-15: PV3, the serving routes KV namespace. Minted under milestone PV3; this file is its contract.
apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: PV-15
spec:
  goal: "Each environment has a media routes KV namespace, created by the cloudflare-kv root and published in WIRING_CLOUDFLARE_KV as media_routes_kv_id, for serve-worker and media-worker to bind."
  affects:
    - default/pixvault/cloudflare-kv
    - infra/terraform/cloudflare-kv/**
    - specs/epics/pixvault-team-media/**
    - tasks/**
  doneWhen:
    - the convergence of this merge applies cloudflare-kv on stage and prod with one namespace added and nothing changed or destroyed
    - WIRING_CLOUDFLARE_KV for stage and prod carries media_routes_kv_id
  gates: []
