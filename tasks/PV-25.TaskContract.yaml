# PV-25: PV4, abuse handling. Minted under milestone PV4; this file is its contract.
apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: PV-25
spec:
  goal: "Anyone can report a served file through its report link (rate-limited, one open case per file); platform operators (a hand-filled table) list cases, take files down (serve-worker answers 451), reinstate them, suspend and unsuspend teams (every file 451, no uploads), and see failed pipeline runs across all teams; everyone else gets 404. docs/ops/abuse-runbook.md says how."
  affects:
    - default/pixvault/media-worker
    - default/pixvault/media-worker-tests
    - default/pixvault/serve-worker
    - default/pixvault/serve-worker-tests
    - default/pixvault/db
    - default/pixvault/db-tests
    - default/pixvault/db-migrate
    - default/pixvault/api-edge
    - default/pixvault/api-edge-tests
    - apps/media-worker/**
    - tests/media-worker/**
    - apps/serve-worker/**
    - tests/serve-worker/**
    - packages/db/**
    - tests/db/**
    - apps/api-edge/**
    - tests/api-edge/**
    - docs/ops/**
    - specs/epics/pixvault-team-media/**
    - ai/context/**
    - tasks/**
  doneWhen:
    - "admin routes are 404 for anyone who isn't an operator, a team owner included (test)"
    - "a takedown blocks serving within 1 minute, measured on stage"
    - "docs/ops/abuse-runbook.md is on main"
  gates: []
