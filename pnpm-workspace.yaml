packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
  - "tooling/*"

# Patched versions of transitive dependencies with security advisories (OWASP A03), each within the major its
# dependents already use. Mostly build-time tooling under the console's OpenNext adapter. See
# docs/security/owasp-review.md and tooling/security/audit-allowlist.json.
overrides:
  "fast-xml-parser@>=4.0.0 <4.5.5": "^4.5.5"
  "postcss@<8.5.18": "^8.5.18"
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
  "body-parser@>=2.0.0 <2.4.0": "^2.4.0"
  "glob@>=10.2.0 <10.5.0": "^10.5.0"
  "brace-expansion@>=5.0.0 <5.0.11": "^5.0.11"
